<!DOCTYPE html>
<html>
<head>
    <title>MIC College Navigation</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #cccccc;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 16px;
        }

        #location {
            margin-top: 15px;
            line-height: 1.6;
        }

        #map {
            height: 400px;
            width: 100%;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 MIC College Navigation</h1>
    <p>DVR & Dr. HS MIC College of Technology</p>
</header>

<div class="container">

    <div class="card">

        <h2>📍 Your Current Location</h2>

        <button onclick="findLocation()">
            Find My Location
        </button>

        <div id="location">
            Location not detected yet.
        </div>

    </div>

    <div class="card">

        <h2>🗺️ Campus Map</h2>

        <div id="map"></div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // MIC College approximate campus location
    const collegeLat = 16.624032;
    const collegeLng = 80.452492;

    // Create map
    const map = L.map("map").setView(
        [collegeLat, collegeLng],
        16
    );

    // OpenStreetMap
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    // College marker
    L.marker([16.624032,80.452492])
        .addTo(map)
        .bindPopup(
            "<b>🎓 DVR & Dr. HS MIC College of Technology</b>"
        )
        .openPopup();

    let studentMarker;

    function findLocation() {

        const output =
            document.getElementById("location");

        if (!navigator.geolocation) {

            output.innerHTML =
                "GPS is not supported.";

            return;
        }

        output.innerHTML =
            "⏳ Finding your location...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                output.innerHTML =
                    "<b>📍 You are here</b><br>" +
                    "Latitude: " + lat.toFixed(6) +
                    "<br>" +
                    "Longitude: " + lng.toFixed(6);

                // Move map to student
                map.setView([lat, lng], 16);

                // Remove old marker
                if (studentMarker) {
                    map.removeLayer(studentMarker);
                }

                // Student marker
                studentMarker =
                    L.marker([lat, lng])
                    .addTo(map)
                    .bindPopup("📍 You are here!")
                    .openPopup();

            },

            function() {

                output.innerHTML =
                    "❌ Unable to get your location. " +
                    "Please allow location permission.";

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

</script>

</body>
</html>
