<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIC College Navigation</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f3f6fa;
            margin: 0;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 25px;
        }

        .box {
            background: white;
            margin: 20px;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            margin: 6px;
        }

        button:active {
            transform: scale(0.98);
        }

        #location {
            margin-top: 20px;
            line-height: 1.8;
        }

        #destination {
            margin-top: 20px;
            line-height: 1.8;
        }

        #map {
            height: 400px;
            margin-top: 20px;
            border-radius: 12px;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #eef3ff;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 MIC College Navigation</h1>
    <p>DVR & Dr. HS MIC College of Technology</p>
</header>


<!-- LIVE LOCATION -->

<div class="box">

    <h2>📍 My Live Location</h2>

    <button onclick="startTracking()">
        ▶️ Start Live Tracking
    </button>

    <button onclick="stopTracking()">
        ⏹️ Stop Tracking
    </button>

    <div id="location" class="status">
        Live tracking not started.
    </div>

</div>


<!-- DESTINATION MENU -->

<div class="box">

    <h2>🧭 Find My Destination</h2>

    <p>Select where you want to go:</p>

    <button onclick="selectDestination('BED Department')">
        🏫 BED Department
    </button>

    <button onclick="selectDestination('Reporting')">
        🧾 Reporting
    </button>

    <button onclick="selectDestination('Administration')">
        🏢 Administration
    </button>

    <button onclick="selectDestination('ECE')">
        📡 ECE
    </button>

    <button onclick="selectDestination('CSE')">
        💻 CSE
    </button>

    <button onclick="selectDestination('EEE')">
        ⚡ EEE
    </button>

    <button onclick="selectDestination('IT')">
        🖥️ IT
    </button>

    <button onclick="selectDestination('Mechanical')">
        ⚙️ Mechanical
    </button>

    <button onclick="selectDestination('Civil')">
        🏗️ Civil
    </button>

    <button onclick="selectDestination('AI & DS')">
        🤖 AI & DS
    </button>

    <button onclick="selectDestination('AI & ML')">
        🤖 AI & ML
    </button>

    <button onclick="selectDestination('Other')">
        📍 Other
    </button>

    <div id="destination" class="status">
        No destination selected.
    </div>

</div>


<!-- MAP -->

<div class="box">

    <h2>🗺️ Interactive Map</h2>

    <div id="map"></div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let map = null;
let marker = null;
let watchID = null;

let currentLatitude = null;
let currentLongitude = null;


// ======================================
// START LIVE TRACKING
// ======================================

function startTracking() {

    const locationBox =
        document.getElementById("location");

    if (!navigator.geolocation) {

        locationBox.innerHTML =
            "❌ GPS is not supported by your browser.";

        return;
    }

    if (watchID !== null) {

        locationBox.innerHTML =
            "🟢 Live tracking is already active.";

        return;
    }

    locationBox.innerHTML =
        "⏳ Starting live tracking...";


    watchID = navigator.geolocation.watchPosition(

        function(position) {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            locationBox.innerHTML =
                "🟢 <b>Live Tracking Active</b><br><br>" +
                "Latitude: " +
                currentLatitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                currentLongitude.toFixed(6) +
                "<br>" +
                "Accuracy: ±" +
                accuracy.toFixed(1) +
                " meters";


            // Create map
            if (!map) {

                map = L.map("map").setView(
                    [
                        currentLatitude,
                        currentLongitude
                    ],
                    18
                );


                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        attribution:
                        "&copy; OpenStreetMap contributors"
                    }
                ).addTo(map);
            }


            // Create marker
            if (!marker) {

                marker = L.marker([
                    currentLatitude,
                    currentLongitude
                ]).addTo(map);

                marker.bindPopup(
                    "📍 You are here"
                );

            } else {

                marker.setLatLng([
                    currentLatitude,
                    currentLongitude
                ]);
            }


            // Keep map centered on current position
            map.setView([
                currentLatitude,
                currentLongitude
            ]);
        },


        function(error) {

            locationBox.innerHTML =
                "❌ Unable to track location.<br><br>" +
                error.message;
        },


        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}


// ======================================
// STOP LIVE TRACKING
// ======================================

function stopTracking() {

    if (watchID !== null) {

        navigator.geolocation.clearWatch(
            watchID
        );

        watchID = null;

        document.getElementById("location").innerHTML =
            "⏹️ Live tracking stopped.";
    }
}


// ======================================
// SELECT DESTINATION
// ======================================

function selectDestination(destinationName) {

    const destinationBox =
        document.getElementById("destination");


    destinationBox.innerHTML =
        "📍 <b>Selected:</b> " +
        destinationName +
        "<br><br>" +
        "⚠️ Exact location has not been saved yet.<br>" +
        "The app will not use guessed coordinates.";
}

</script>

</body>
</html>
