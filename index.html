<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIC College Navigation</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f3f6fa;
            margin: 0;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 25px;
        }

        .box {
            background: white;
            margin: 20px;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            margin: 5px;
        }

        #location {
            margin-top: 20px;
            line-height: 1.8;
        }

        #map {
            height: 400px;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 MIC College Navigation</h1>
    <p>DVR & Dr. HS MIC College of Technology</p>
</header>

<div class="box">

    <h2>📍 Live Location</h2>

    <button onclick="startTracking()">
        ▶️ Start Live Tracking
    </button>

    <button onclick="stopTracking()">
        ⏹️ Stop Tracking
    </button>

    <div id="location">
        Live tracking not started.
    </div>

    <div id="map"></div>

</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

let map;
let marker;
let watchID = null;

// Start live tracking
function startTracking() {

    const locationBox =
        document.getElementById("location");

    if (!navigator.geolocation) {

        locationBox.innerHTML =
            "❌ GPS is not supported by this browser.";

        return;
    }

    locationBox.innerHTML =
        "⏳ Starting live tracking...";

    // Avoid starting tracking twice
    if (watchID !== null) {
        return;
    }

    watchID = navigator.geolocation.watchPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            locationBox.innerHTML =
                "🟢 <b>Live Tracking Active</b><br><br>" +
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6) +
                "<br>" +
                "Accuracy: ±" +
                accuracy.toFixed(1) +
                " meters";

            // Create map
            if (!map) {

                map = L.map("map").setView(
                    [latitude, longitude],
                    18
                );

                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        attribution:
                        "&copy; OpenStreetMap contributors"
                    }
                ).addTo(map);
            }

            // Create marker
            if (!marker) {

                marker = L.marker(
                    [latitude, longitude]
                ).addTo(map);

                marker.bindPopup(
                    "📍 You are here"
                ).openPopup();

            } else {

                // Move marker
                marker.setLatLng(
                    [latitude, longitude]
                );
            }

            // Keep map centered on you
            map.setView(
                [latitude, longitude],
                18
            );
        },

        function(error) {

            locationBox.innerHTML =
                "❌ Unable to track location.<br><br>" +
                "Error code: " +
                error.code +
                "<br>" +
                error.message;

        },

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}


// Stop live tracking
function stopTracking() {

    const locationBox =
        document.getElementById("location");

    if (watchID !== null) {

        navigator.geolocation.clearWatch(
            watchID
        );

        watchID = null;

        locationBox.innerHTML =
            "⏹️ Live tracking stopped.";
    }
}

</script>

</body>
</html>
