<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIC College Navigation</title>

    <!-- Map CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f6fa;
            text-align: center;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 25px 10px;
        }

        .box {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 15px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 14px 18px;
            margin: 6px;
            border-radius: 8px;
            font-size: 16px;
        }

        button:active {
            transform: scale(0.97);
        }

        #location,
        #destination {
            margin-top: 15px;
            padding: 12px;
            line-height: 1.7;
            background: #eef3ff;
            border-radius: 8px;
        }

        #map {
            width: 100%;
            height: 400px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .destination-button {
            display: block;
            width: 90%;
            margin: 8px auto;
        }

    </style>
</head>


<body>

<header>

    <h1>🎓 MIC College Navigation</h1>

    <p>
        DVR & Dr. HS MIC College of Technology
    </p>

</header>


<!-- ============================= -->
<!-- LIVE LOCATION -->
<!-- ============================= -->

<div class="box">

    <h2>📍 My Live Location</h2>

    <button onclick="startTracking()">
        ▶️ Start Live Tracking
    </button>

    <button onclick="stopTracking()">
        ⏹️ Stop Tracking
    </button>

    <div id="location">

        Live tracking not started.

    </div>

</div>


<!-- ============================= -->
<!-- DESTINATION MENU -->
<!-- ============================= -->

<div class="box">

    <h2>🧭 Find My Destination</h2>

    <p>
        Select the place you want to find:
    </p>


    <button
        class="destination-button"
        onclick="selectDestination('BED Department')">

        🏫 BED Department

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('Reporting')">

        🧾 Reporting

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('Administration')">

        🏢 Administration

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('ECE')">

        📡 ECE

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('CSE')">

        💻 CSE

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('EEE')">

        ⚡ EEE

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('IT')">

        🖥️ IT

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('Mechanical')">

        ⚙️ Mechanical

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('Civil')">

        🏗️ Civil

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('AI & DS')">

        🤖 AI & DS

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('AI & ML')">

        🤖 AI & ML

    </button>


    <button
        class="destination-button"
        onclick="selectDestination('Other')">

        📍 Other

    </button>


    <div id="destination">

        No destination selected.

    </div>

</div>


<!-- ============================= -->
<!-- MAP -->
<!-- ============================= -->

<div class="box">

    <h2>🗺️ Interactive Map</h2>

    <div id="map"></div>

</div>


<!-- Leaflet JavaScript -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let map = null;

let marker = null;

let watchID = null;

let currentLatitude = null;

let currentLongitude = null;


// =================================
// START LIVE TRACKING
// =================================

function startTracking() {

    const locationBox =
        document.getElementById("location");


    if (!navigator.geolocation) {

        locationBox.innerHTML =
            "❌ GPS is not supported.";

        return;
    }


    if (watchID !== null) {

        locationBox.innerHTML =
            "🟢 Live Tracking is already active.";

        return;
    }


    locationBox.innerHTML =
        "⏳ Finding your location...";


    watchID =
        navigator.geolocation.watchPosition(

        function(position) {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            locationBox.innerHTML =

                "🟢 <b>LIVE TRACKING ACTIVE</b>" +
                "<br><br>" +

                "Latitude: " +
                currentLatitude.toFixed(6) +

                "<br>" +

                "Longitude: " +
                currentLongitude.toFixed(6) +

                "<br>" +

                "Accuracy: ±" +
                accuracy.toFixed(1) +
                " meters";


            // =========================
            // CREATE MAP
            // =========================

            if (!map) {

                map =
                    L.map("map").setView(

                    [
                        currentLatitude,
                        currentLongitude
                    ],

                    18
                );


                L.tileLayer(

                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                    {

                        attribution:
                        "&copy; OpenStreetMap contributors"

                    }

                ).addTo(map);

            }


            // =========================
            // CREATE LOCATION MARKER
            // =========================

            if (!marker) {

                marker =
                    L.marker(

                    [
                        currentLatitude,
                        currentLongitude
                    ]

                ).addTo(map);


                marker.bindPopup(
                    "📍 You are here"
                );


            } else {

                marker.setLatLng(

                    [
                        currentLatitude,
                        currentLongitude
                    ]

                );

            }


            // Keep map centered

            map.setView(

                [
                    currentLatitude,
                    currentLongitude
                ],

                18
            );

        },


        function(error) {

            locationBox.innerHTML =

                "❌ Location error:" +
                "<br><br>" +

                error.message;

        },


        {

            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0

        }

    );

}


// =================================
// STOP LIVE TRACKING
// =================================

function stopTracking() {

    if (watchID !== null) {

        navigator.geolocation.clearWatch(
            watchID
        );

        watchID = null;


        document.getElementById(
            "location"
        ).innerHTML =

            "⏹️ Live tracking stopped.";

    }

}


// =================================
// SELECT DESTINATION
// =================================

function selectDestination(name) {

    document.getElementById(
        "destination"
    ).innerHTML =

        "📍 <b>Selected:</b> " +
        name +

        "<br><br>" +

        "⚠️ Exact location is not saved yet." +

        "<br>" +

        "We will not use guessed coordinates.";

}

</script>

</body>
</html>
