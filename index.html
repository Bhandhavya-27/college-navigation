<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIC College Navigation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f3f6fa;
            margin: 0;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 25px;
        }

        .box {
            background: white;
            margin: 20px;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
        }

        #location {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 MIC College Navigation</h1>
    <p>DVR & Dr. HS MIC College of Technology</p>
</header>

<div class="box">

    <h2>📍 Your Current Location</h2>

    <button onclick="findLocation()">
        📍 Find My Location
    </button>

    <div id="location">
        Location not detected yet.
    </div>

</div>

<script>

function findLocation() {

    const locationBox =
        document.getElementById("location");

    locationBox.innerHTML =
        "⏳ Finding your location...";

    if (!navigator.geolocation) {

        locationBox.innerHTML =
            "❌ Your browser does not support GPS.";

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            locationBox.innerHTML =
                "✅ <b>Location Found!</b><br><br>" +
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6);

        },

        function(error) {

            locationBox.innerHTML =
                "❌ GPS could not be accessed.<br><br>" +
                "Error code: " +
                error.code +
                "<br>" +
                error.message;

        },

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
