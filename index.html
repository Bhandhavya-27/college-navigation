<!DOCTYPE html>
<html>
<head>
    <title>MIC College Navigation</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f5f9;
            text-align: center;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 20px;
        }

        .box {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
        }

        #location {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 MIC College Navigation</h1>
    <p>DVR & Dr. HS MIC College of Technology</p>
</header>

<div class="box">

    <h2>📍 Your Location</h2>

    <button onclick="findLocation()">
        Find My Location
    </button>

    <p id="location">
        Location not detected yet.
    </p>

</div>


<div class="box">

    <h2>🎯 Admission Destinations</h2>

    <h3>🏫 BED Block</h3>

    <p>
        📝 Registration
    </p>

    <p>
        📄 Certificate Verification
    </p>

    <button onclick="bedBlock()">
        🏫 Go to BED Block
    </button>

    <p id="destination"></p>

</div>


<script>

let studentMarker = null;
let watchId = null;

function findLocation() {

    const output = document.getElementById("location");

    if (!navigator.geolocation) {

        output.innerHTML =
            "❌ GPS is not supported by your browser.";

        return;
    }

    output.innerHTML =
        "📍 Starting live location tracking...";

    watchId = navigator.geolocation.watchPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            output.innerHTML =
                "<b>📍 Live Location</b><br>" +
                "Latitude: " +
                latitude.toFixed(6) +
                "<br>" +
                "Longitude: " +
                longitude.toFixed(6) +
                "<br>" +
                "Accuracy: approximately " +
                Math.round(accuracy) +
                " metres";


            /*
             * Create the marker the first time.
             */

            if (studentMarker === null) {

                studentMarker =
                    L.marker([
                        latitude,
                        longitude
                    ])
                    .addTo(map)
                    .bindPopup(
                        "📍 You are here!"
                    );

            }

            /*
             * Move the marker whenever
             * the phone location changes.
             */

            else {

                studentMarker.setLatLng([
                    latitude,
                    longitude
                ]);

            }


            /*
             * Keep the map centered
             * on the student.
             */

            map.setView([
                latitude,
                longitude
            ], 17);

        },


        function(error) {

            output.innerHTML =
                "❌ Unable to track your location.<br>" +
                "Please allow location permission.";

        },


        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }

    );
}


function bedBlock() {

    document.getElementById("destination").innerHTML =
        "🏫 BED Block selected.<br>" +
        "Registration and Certificate Verification " +
        "are located here.<br><br>" +
        "📍 Exact BED Block GPS location will be added " +
        "when we collect it at the college.";

}

</script>

</body>
</html>
